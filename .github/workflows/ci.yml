name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        pip install -e ".[dev]"

    - name: Run Ruff (lint)
      run: |
        ruff check packages/ --ignore W,B

    - name: Run Ruff (format check)
      run: |
        ruff format --check packages/

    - name: Run tests
      run: |
        PYTHONPATH=packages pytest -m "not (integration or ai_generated)" --tb=short --cov=cherenkov --cov-report=xml

    - name: Upload coverage to Codecov
      if: always()
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN || secrets.GITHUB_TOKEN }}
        fail_ci_if_error: false
        verbose: true

  frontend-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Cache npm dependencies
      uses: actions/cache@v4
      with:
        path: ~/.npm
        key: ${{ runner.os }}-node-${{ hashFiles('packages/cherenkov/web/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-node-

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Install dependencies
      working-directory: packages/cherenkov/web
      run: npm ci

    - name: Get Playwright version
      id: playwright-version
      working-directory: packages/cherenkov/web
      run: |
        echo "version=$(npm ls @playwright/test | grep @playwright/test | awk -F@ '{print $NF}')" >> $GITHUB_OUTPUT

    - name: Cache Playwright browsers
      id: playwright-cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}
        restore-keys: |
          ${{ runner.os }}-playwright-

    - name: Install Playwright Browsers
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      working-directory: packages/cherenkov/web
      run: npx playwright install --with-deps

    - name: Install Playwright dependencies
      if: steps.playwright-cache.outputs.cache-hit == 'true'
      working-directory: packages/cherenkov/web
      run: npx playwright install-deps

    - name: Run Playwright tests
      working-directory: packages/cherenkov/web
      run: npm run test

    - name: Upload Playwright report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: packages/cherenkov/web/playwright-report/
        retention-days: 30

  docs-drift:
    # Enforce the Documentation Mandate (AGENTS.md). Any PR touching a
    # documented surface (API, storage, auth middleware) must also update
    # cherno-docs/. PR-only — pushes to main bypass.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check for documentation drift
        env:
          BASE: origin/${{ github.base_ref }}
        run: scripts/check-docs-drift.sh

  docs-build:
    # Build the Starlight docs site. Node 22 is required by Astro 6.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: cherno-docs/package-lock.json
      - name: Install docs dependencies
        working-directory: cherno-docs
        run: npm install
      - name: Build Starlight site
        working-directory: cherno-docs
        run: npm run build
      - name: Upload built site
        uses: actions/upload-artifact@v4
        with:
          name: docs-dist
          path: cherno-docs/dist/
          retention-days: 14
