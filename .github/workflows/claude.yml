name: Sovereign Agentic CI Reviewer

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  OLLAMA_BASE_URL: "http://localhost:11434" # Configured self-hosted open LLM runner endpoint

jobs:
  agent_review:
    # Trigger only when agent attention is requested via @agent
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@agent')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@agent')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@agent')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@agent') || contains(github.event.issue.title, '@agent')))
    runs-on: self-hosted # Run on offline secure compliance nodes
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python Virtual Environment
        run: |
          python3 -m venv .venv
          source .venv/bin/activate
          pip install -e ".[dev]"

      - name: Sovereign Multi-Agent Review & Code Formatting
        run: |
          source .venv/bin/activate
          # Run fully local static review audits using the sovereign decision roundtable hub
          python3 -c "
          from cherenkov.agents.decision_hub import DecisionHub
          hub = DecisionHub()
          print('Sovereign Hub Active and fully tool-agnostic.')
          "
          ruff format packages/
          ruff check packages/ --ignore W,S,B

