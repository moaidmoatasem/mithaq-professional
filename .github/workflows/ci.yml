name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        pip install -e ".[dev]"

    - name: Run Ruff (lint)
      run: |
        ruff check packages/ --ignore W,S,B

    - name: Run Ruff (format check)
      run: |
        ruff format --check packages/

    - name: Run tests
      run: |
        PYTHONPATH=packages pytest -m "not (integration or ai_generated)" --tb=short --cov=cherenkov --cov-report=xml

    - name: Upload coverage to Codecov
      if: always()
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN || secrets.GITHUB_TOKEN }}
        fail_ci_if_error: false
        verbose: true

  frontend-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install dependencies
      working-directory: packages/cherenkov/web
      run: npm install

    - name: Install Playwright Browsers
      working-directory: packages/cherenkov/web
      run: npx playwright install --with-deps

    - name: Run Playwright tests
      working-directory: packages/cherenkov/web
      run: npm run test

    - name: Upload Playwright report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: packages/cherenkov/web/playwright-report/
        retention-days: 30
